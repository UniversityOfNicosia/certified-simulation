name: replay

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  certificates:
    name: Certificates replay byte-for-byte
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Regenerate every certificate
        run: |
          uv run python papers/finite-horizon-memory/certificates/certify_finite_horizon_memory.py
          uv run python papers/finite-horizon-memory/certificates/certify_queue_conditioning.py
          uv run python papers/finite-horizon-memory/certificates/certify_dissipative_decay.py
          uv run python papers/initial-trace-entropy-separation/certificates/certify_initial_trace_insufficiency.py
          uv run python papers/initial-trace-entropy-separation/certificates/certify_entropy_accounting_separation.py
          uv run python papers/coarse-observability-high-order/certificates/certify_observation_rank_structure.py
          uv run python papers/coarse-observability-high-order/certificates/certify_dissipation_conditioning_erasure.py
      - name: Require byte identity with the committed artifacts
        run: git diff --exit-code -- 'papers/*/artifacts'
      - name: Run the replay test suite
        run: uv run pytest -q

  experiments:
    name: Numerical experiments run end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Run the experiment and table pipeline
        working-directory: papers/finite-horizon-memory/experiments
        run: |
          uv run --group experiments python run_experiments.py
          uv run --group experiments python make_tables.py
      - name: Run the short note's author certificate script
        working-directory: papers/initial-trace-entropy-separation/experiments
        run: uv run python run_closure_certificates.py
      - name: Run the fourth paper's self-tests, experiments, and tables
        working-directory: papers/coarse-observability-high-order/src
        run: |
          uv run --group experiments python schemes.py
          uv run --group experiments python certificates.py
          uv run --group experiments python nonlinear.py
          uv run --group experiments python run_experiments.py
          uv run --group experiments python make_tables.py
      - name: List the fourth paper's outputs that changed on this runner
        run: git status --porcelain -- papers/coarse-observability-high-order/results papers/coarse-observability-high-order/figures
      - name: Require byte identity for the fourth paper's reproducible outputs
        working-directory: papers/coarse-observability-high-order/results
        run: >-
          git diff --exit-code --
          tables
          collision_certificate.csv
          collision_certificate_exact.csv
          erasure_orders.csv
          stability_certificate.csv
          local_observability.csv
          rank_collision_catalogue.csv
          rank_vs_horizon_smalllambda.csv

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No build residue is tracked
        run: |
          if git ls-files | grep -E '\.(aux|bbl|blg|synctex\.gz)$'; then
            echo "LaTeX build residue is tracked; remove it." >&2
            exit 1
          fi
